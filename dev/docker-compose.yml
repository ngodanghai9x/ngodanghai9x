services:
  jekyll:
    image: jekyll/jekyll:latest
    working_dir: /srv/jekyll
    environment:
      BUNDLE_GEMFILE: /srv/jekyll/dev/Gemfile
    volumes:
      - ../:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    ports:
      - "4400:4000"
    command: bash -c "bundle install && bundle exec jekyll serve --config _config.yml,dev/_config.dev.yml --host 0.0.0.0 --watch --force_polling"

volumes:
  bundle_cache:
